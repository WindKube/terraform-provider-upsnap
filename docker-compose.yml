services:
  upsnap:
    image: ghcr.io/seriousm4x/upsnap:5.7.3
    ports:
      - "${UPSNAP_PORT:-8090}:8090"
    environment:
      # The ping cron saves whole stale device records and would revert concurrent test writes.
      UPSNAP_INTERVAL: "0 0 0 1 1 *"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8090/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30
